<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><style>text{font-family:'PingFang SC','Heiti SC','Arial',sans-serif}</style><rect x="0" y="0" width="1400" height="820" fill="#fff" rx="0"/><text x="64" y="95" fill="#14243c" font-size="44" font-weight="700" text-anchor="start">同一个策略，先把起点说清楚</text><text x="64" y="144" fill="#61718a" font-size="26" font-weight="400" text-anchor="start">历史月均价窗口 ≠ 个人实际成交窗口</text><rect x="64" y="185" width="1272" height="128" fill="#edf3fa" rx="16"/><text x="88" y="228" fill="#14243c" font-size="28" font-weight="700" text-anchor="start">历史窗口 A</text><text x="88" y="267" fill="#61718a" font-size="22" font-weight="400" text-anchor="start">约 6 个月</text><line x1="450" y1="228" x2="825" y2="228" stroke="#3265a8" stroke-width="4" /><circle cx="450" cy="228" r="8" fill="#3265a8"/><circle cx="825" cy="228" r="8" fill="#3265a8"/><path d="M 809 218 L 825 228 L 809 238" fill="none" stroke="#3265a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="273" fill="#14243c" font-size="24" font-weight="600" text-anchor="middle">10 月均价</text><text x="825" y="273" fill="#14243c" font-size="24" font-weight="600" text-anchor="middle">次年 4 月均价</text><rect x="64" y="332" width="1272" height="128" fill="#edf3fa" rx="16"/><text x="88" y="375" fill="#14243c" font-size="28" font-weight="700" text-anchor="start">历史窗口 B</text><text x="88" y="414" fill="#61718a" font-size="22" font-weight="400" text-anchor="start">约 12 个月</text><line x1="450" y1="375" x2="1200" y2="375" stroke="#3265a8" stroke-width="4" /><circle cx="450" cy="375" r="8" fill="#3265a8"/><circle cx="1200" cy="375" r="8" fill="#3265a8"/><path d="M 1184 365 L 1200 375 L 1184 385" fill="none" stroke="#3265a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="420" fill="#14243c" font-size="24" font-weight="600" text-anchor="middle">10 月均价</text><text x="1200" y="420" fill="#14243c" font-size="24" font-weight="600" text-anchor="middle">次年 10 月均价</text><rect x="64" y="479" width="1272" height="128" fill="#fbf6e9" rx="16"/><text x="88" y="522" fill="#14243c" font-size="28" font-weight="700" text-anchor="start">真实交易</text><text x="88" y="561" fill="#61718a" font-size="22" font-weight="400" text-anchor="start">按真实成本复盘</text><line x1="450" y1="522" x2="1120" y2="522" stroke="#b88b42" stroke-width="4" stroke-dasharray="10 7"/><circle cx="450" cy="522" r="8" fill="#b88b42"/><circle cx="1120" cy="522" r="8" fill="#b88b42"/><path d="M 1104 512 L 1120 522 L 1104 532" fill="none" stroke="#b88b42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="567" fill="#14243c" font-size="24" font-weight="600" text-anchor="middle">实际成交日</text><text x="1120" y="567" fill="#14243c" font-size="24" font-weight="600" text-anchor="middle">预先约定退出日</text><rect x="64" y="641" width="1272" height="119" fill="#fbf6e9" rx="14"/><rect x="64" y="641" width="5" height="119" fill="#b88b42" rx="2"/><text x="90" y="686" fill="#14243c" font-size="30" font-weight="700" text-anchor="start">已过 10 月，不能沿用 10 月成本</text><text x="90" y="727" fill="#61718a" font-size="23" font-weight="400" text-anchor="start">个人回报取决于实际成交价格，以及分红、费用与税；时间轴仅示意比较口径。</text><text x="64" y="796" fill="#61718a" font-size="21" font-weight="400" text-anchor="start">示意图 · 历史窗口用于研究；实际交易需另行制定入场、退出与风险安排。</text></svg>