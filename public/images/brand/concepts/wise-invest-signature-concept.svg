  <text x="82" y="371" fill="#171513" font-family="Bodoni 72, Didot, Georgia, serif" font-size="240" font-style="italic" letter-spacing="-16">Wise</text>
  <text x="699" y="370" fill="#171513" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="600" letter-spacing="18">INVEST</text>
  <text x="95" y="524" fill="#7B7161" font-family="Arial, sans-serif" font-size="22" letter-spacing="1">Clarity for long-term capital.</text>
  <circle cx="1090" cy="464" r="7" fill="#B68C44"/>
  <image href="/images/brand/wise-invest-signature.png" x="968" y="30" width="192" height="53" preserveAspectRatio="xMidYMid meet" clip-path="url(#signatureClip)"/>
</svg>
