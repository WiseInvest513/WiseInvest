<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wise Invest — 投资者签名字标</title>
  <desc id="desc">Warm ivory editorial identity with a refined Wise Invest signature wordmark.</desc>
  <defs>
    <linearGradient id="paper" x1="40" y1="20" x2="1160" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F3EBDD"/>
    </linearGradient>
    <clipPath id="signatureClip">
      <rect x="968" y="30" width="192" height="53" rx="11"/>
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <path d="M92 463H1108" stroke="#C7B69B" stroke-width="2"/>
  <path d="M93 181H235" stroke="#B68C44" stroke-width="7" stroke-linecap="round"/>
