<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="长期计划包含预算、执行、对账、复核以及条件变化后的调整">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#799cd6" stroke-width="1.5"/></marker></defs>
<rect width="960" height="480" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#203451"><text x="40" y="54" font-size="32" fill="#203451" text-anchor="start">一份可持续计划，是一个检查闭环</text><rect x="55" y="95" width="350" height="110" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="230" y="138" font-size="32" fill="#254775" text-anchor="middle">预算</text><text x="230" y="177" font-size="24" fill="#647992" text-anchor="middle">用途与可用结余</text><rect x="525" y="95" width="350" height="110" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="700" y="138" font-size="32" fill="#254775" text-anchor="middle">执行</text><text x="700" y="177" font-size="24" fill="#647992" text-anchor="middle">身份、状态、价格</text><rect x="55" y="275" width="350" height="110" rx="18" fill="#e8f5ef" stroke="#dce6f4" stroke-width="2"/><text x="230" y="318" font-size="32" fill="#254775" text-anchor="middle">对账</text><text x="230" y="357" font-size="24" fill="#647992" text-anchor="middle">确认份额与现金</text><rect x="525" y="275" width="350" height="110" rx="18" fill="#e8f5ef" stroke="#dce6f4" stroke-width="2"/><text x="700" y="318" font-size="32" fill="#254775" text-anchor="middle">复核</text><text x="700" y="357" font-size="24" fill="#647992" text-anchor="middle">比例与生活条件</text><path d="M425 147 L500 147" fill="none" stroke="#799cd6" stroke-width="4" marker-end="url(#arrow)"/><path d="M705 217 L705 255" fill="none" stroke="#799cd6" stroke-width="4" marker-end="url(#arrow)"/><path d="M505 327 L435 327" fill="none" stroke="#799cd6" stroke-width="4" marker-end="url(#arrow)"/><path d="M230 257 L230 217" fill="none" stroke="#799cd6" stroke-width="4" marker-end="url(#arrow)"/><text x="480" y="452" font-size="26" fill="#647992" text-anchor="middle">条件改变时调整规则，而不是追逐每次涨跌</text></g></svg>
