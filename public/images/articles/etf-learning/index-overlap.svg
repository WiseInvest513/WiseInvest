<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="虚构账户60%持基金甲和40%持基金乙，两者公司A权重10%和6%，合计8.4%">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#799cd6" stroke-width="1.5"/></marker></defs>
<rect width="960" height="480" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#203451"><text x="40" y="54" font-size="32" fill="#203451" text-anchor="start">先乘账户比例，再合并共同公司</text><circle cx="370" cy="222" r="128" fill="#abc5f7" fill-opacity=".55"/><circle cx="575" cy="222" r="128" fill="#bcdcd3" fill-opacity=".65"/><text x="323" y="195" font-size="36" fill="#315fd7" text-anchor="middle">甲</text><text x="323" y="247" font-size="28" fill="#315fd7" text-anchor="middle">账户 60%</text><text x="625" y="195" font-size="36" fill="#31766c" text-anchor="middle">乙</text><text x="625" y="247" font-size="28" fill="#31766c" text-anchor="middle">账户 40%</text><text x="475" y="207" font-size="30" fill="#203451" text-anchor="middle">公司A</text><text x="475" y="251" font-size="24" fill="#526781" text-anchor="middle">共同持有</text><rect x="85" y="375" width="790" height="70" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="480" y="421" font-size="34" fill="#315fd7" text-anchor="middle">60% × 10% + 40% × 6% = 8.4%</text></g></svg>
