<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="虚构例子：参考价值1到1.02上涨2%，成交价1.05到1.02仍亏2.86%">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#799cd6" stroke-width="1.5"/></marker></defs>
<rect width="960" height="480" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#203451"><text x="40" y="54" font-size="32" fill="#203451" text-anchor="start">底层上涨，也可能被溢价回落抵消</text><text x="292" y="102" font-size="30" fill="#647992" text-anchor="middle">进入</text><text x="710" y="102" font-size="30" fill="#647992" text-anchor="middle">退出</text><rect x="160" y="126" width="260" height="110" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="290" y="169" font-size="32" fill="#254775" text-anchor="middle">参考值 1.00</text><text x="290" y="208" font-size="24" fill="#647992" text-anchor="middle">价格 1.05 / 溢价5%</text><path d="M450 180 L540 180" fill="none" stroke="#799cd6" stroke-width="4" marker-end="url(#arrow)"/><rect x="570" y="126" width="260" height="110" rx="18" fill="#e8f5ef" stroke="#dce6f4" stroke-width="2"/><text x="700" y="169" font-size="32" fill="#254775" text-anchor="middle">参考值 1.02</text><text x="700" y="208" font-size="24" fill="#647992" text-anchor="middle">价格 1.02 / 溢价0%</text><text x="480" y="304" font-size="34" fill="#315fd7" text-anchor="middle">资产价值 +2% ≠ 个人回报 +2%</text><rect x="108" y="350" width="744" height="75" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="480" y="400" font-size="36" fill="#a25f3d" text-anchor="middle">1.02 ÷ 1.05 − 1 ≈ −2.86%</text></g></svg>
