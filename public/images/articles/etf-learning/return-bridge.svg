<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="虚构例子：美元资产涨10%乘美元兑人民币跌5%，人民币回报4.5%">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#799cd6" stroke-width="1.5"/></marker></defs>
<rect width="960" height="480" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#203451"><text x="40" y="54" font-size="32" fill="#203451" text-anchor="start">跨币种回报：用乘法，不是简单相加</text><rect x="55" y="135" width="300" height="110" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="205" y="178" font-size="32" fill="#254775" text-anchor="middle">美元资产</text><text x="205" y="217" font-size="24" fill="#647992" text-anchor="middle">回报 +10%</text><path d="M375 190 L455 190" fill="none" stroke="#799cd6" stroke-width="4" marker-end="url(#arrow)"/><rect x="485" y="135" width="420" height="110" rx="18" fill="#e8f5ef" stroke="#dce6f4" stroke-width="2"/><text x="695" y="178" font-size="32" fill="#254775" text-anchor="middle">美元兑人民币</text><text x="695" y="217" font-size="24" fill="#647992" text-anchor="middle">每美元对应人民币 −5%</text><rect x="115" y="305" width="730" height="100" rx="18" fill="#fff" stroke="#dce6f4" stroke-width="2"/><text x="480" y="366" font-size="40" fill="#315fd7" text-anchor="middle">1.10 × 0.95 − 1 = +4.5%</text><text x="480" y="448" font-size="26" fill="#647992" text-anchor="middle">简化假设：未计费用、税费与期间现金流</text></g></svg>
